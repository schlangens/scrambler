<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Scrambler</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400&family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
    <style>:root{--black:#0a0a0f;--dark:#0d0d14;--darker-blue:#0f1729;--blue:#2563eb;--blue-bright:#3b82f6;--text:#e2e8f0;--text-dim:#64748b;--text-muted:#334155;--red:#ef4444}*{margin:0;padding:0;box-sizing:border-box}body{background:var(--black);color:var(--text);font-family:'Space Grotesk',sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center}.bg{position:fixed;inset:0;background:radial-gradient(ellipse 80% 50% at 20% -20%,rgba(37,99,235,.15) 0%,transparent 50%);pointer-events:none}.c{position:relative;z-index:1;width:100%;max-width:400px;padding:2rem}.logo{text-align:center;margin-bottom:2rem}.logo h1{font-size:1.5rem}.logo h1 span{color:var(--blue-bright)}.logo p{font-family:'JetBrains Mono',monospace;font-size:.8rem;color:var(--text-dim)}.card{background:linear-gradient(135deg,rgba(15,23,41,.8),rgba(13,13,20,.9));border:1px solid rgba(37,99,235,.2);border-radius:12px;padding:2rem}.error{background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.3);color:var(--red);padding:.75rem;border-radius:8px;margin-bottom:1.5rem;display:none}.error.show{display:block}.gbtn{width:100%;display:flex;align-items:center;justify-content:center;gap:.75rem;padding:.875rem;background:var(--darker-blue);border:1px solid rgba(37,99,235,.3);border-radius:8px;color:var(--text);font-size:1rem;cursor:pointer;text-decoration:none;transition:all .2s}.gbtn:hover{background:#1a2744;border-color:var(--blue)}.gbtn svg{width:20px;height:20px}.div{display:flex;align-items:center;margin:1.5rem 0;color:var(--text-muted);font-size:.75rem;text-transform:uppercase}.div::before,.div::after{content:'';flex:1;height:1px;background:rgba(37,99,235,.2)}.div span{padding:0 1rem}form{display:flex;flex-direction:column;gap:.75rem}input{padding:.75rem;background:var(--black);border:1px solid rgba(37,99,235,.2);border-radius:6px;color:var(--text);font-family:'JetBrains Mono',monospace;font-size:.9rem;outline:none}input:focus{border-color:var(--blue)}button{padding:.75rem;background:var(--darker-blue);border:1px solid rgba(37,99,235,.2);border-radius:6px;color:var(--text-dim);font-family:inherit;font-size:.9rem;cursor:pointer}button:hover{background:#1a2744;border-color:var(--blue);color:var(--text)}</style>
</head>
<body><div class="bg"></div><div class="c"><div class="logo"><h1>🔀 <span>Scrambler</span></h1><p>scramble.scottslab.io</p></div><div class="card"><div class="error" id="e">Access denied.</div><a href="/auth/google" class="gbtn"><svg viewBox="0 0 24 24"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>Sign in with Google</a><div class="div"><span>or</span></div><form action="/auth/login" method="POST"><input type="text" name="username" placeholder="Username" required><input type="password" name="password" placeholder="Password" required><button type="submit">Sign In</button></form></div></div><script>if(new URLSearchParams(location.search).get('error'))document.getElementById('e').classList.add('show')</script></body>
</html>
